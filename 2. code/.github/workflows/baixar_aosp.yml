name: Sincronizar Android 15 Puro (AOSP)

# O script roda quando você clica em iniciar manualmente no painel Actions
on:
  workflow_dispatch:

jobs:
  preparar_e_baixar:
    runs-on: ubuntu-latest

    steps:
    # 1. Configura o espaço de armazenamento virtual
    - name: Inicializar Espaço de Trabalho
      uses: actions/checkout@v4

    # 2. Instala as ferramentas necessárias para compilar e sincronizar o Android
    - name: Configurar Ferramentas do Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    # 3. Configura o Git com a sua identidade (essencial para a ferramenta do Google funcionar)
    - name: Configurar Identidade Git
      run: |
        git config --global user.name "Desenvolvedor G22"
        git config --global user.email "g22_dev@example.com"

    # 4. Instala a ferramenta 'repo' do Google (gerenciador de códigos do Android)
    - name: Instalar Ferramenta Repo do Google
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    # 5. Aponta para o servidor do Google e diz que você quer o Android 15 limpo
    - name: Inicializar Manifesto do Android 15
      run: |
        mkdir -p android_aosp
        cd android_aosp
        repo init -u https://googlesource.com -b android-15.0.0_r1 --depth=1

    # 6. Baixa a estrutura básica do sistema operacional
    - name: Sincronizar Códigos do Google (Download)
      run: |
        cd android_aosp
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        echo "AOSP Puro baixado com sucesso no servidor!"
