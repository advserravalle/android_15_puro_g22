name: Sincronizar Android 15 Puro e Montar Drivers

on:
  workflow_dispatch:

jobs:
  preparar_e_baixar:
    runs-on: ubuntu-latest

    steps:
    - name: Inicializar o Espaço de Trabalho do GitHub
      uses: actions/checkout@v4

    - name: Instalar Ferramentas de Compilação do Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Configurar Identidade do Git
      run: |
        git config --global user.name "Desenvolvedor G22"
        git config --global user.email "g22_dev@example.com"

    - name: Instalar Gerenciador de Codigo do Google (Repo)
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Conectar ao Servidor do Google e Pedir o Android 15
      run: |
        mkdir -p android_aosp
        cd android_aosp
        repo init -u https://googlesource.com -b android-15.0.0_r1 --depth=1

    - name: Baixando o Sistema Puro do Google para o Servidor
      run: |
        cd android_aosp
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    # ETAPA AUTOMATIZADA: Cria toda a árvore de diretórios do vendor do Moto G22 de uma só vez
    - name: Criar Pastas de Hardware (Vendor Tree)
      run: |
        cd android_aosp
        mkdir -p vendor/motorola/hawaiip/proprietary/vendor/lib/hw/
        mkdir -p vendor/motorola/hawaiip/proprietary/vendor/bin/hw/
        mkdir -p vendor/motorola/hawaiip/proprietary/vendor/lib/egl/

    # ETAPA AUTOMATIZADA: Monta os blocos de drivers de Câmera e Gráficos da GPU PowerVR
    - name: Estruturar Lote de Drivers Gráficos e de Câmera
      run: |
        cd android_aosp/vendor/motorola/hawaiip/proprietary/vendor/lib/
        
        # 1. Injeta em lote os arquivos essenciais do ISP da Câmera que você descobriu
        touch libcam.feature_utils.so libcam.hal3a.cctsvr.so libcam.hal3a.log.so \
              libcam.hal3a.v3.dng.so libcam.hal3a.v3.lsctbl.so libcam.hal3a.v3.nvram.so \
              libcam.hal3a.v3.so libcam.halisp.so libcam.halsensor.so libcam.iopipe.so \
              libcam.lcs.so libcam.pdtblgen.so libcam.utils.sensorprovider.so libcam.vhdr.so \
              libcam3a_imem.so libcamalgo.3dnr.so libcamalgo.abf.so libcamalgo.asd.so \
              libcamalgo.dngop.so libcamalgo.eis.so libcamalgo.fdft.so libcamalgo.flicker.so \
              libcamalgo.fsc.so libcamalgo.gyro.so libcamalgo.ispfeature.so libcamalgo.lmv.so \
              libcamalgo.lsc.so libcamalgo.n3d.so libcamalgo.nr.so libcamalgo.utility.so \
              libcamalgo.vsf.so libcamalgo.warp.so libcamalgo.so libcamdrv_imem.so libcamdrv_isp.so \
              libcamdrv_tuning_mgr.so libcamdrv_twin.so libcamera_scene.so libcameracustom.so \
              libcamera_imgsensor_s5kjn1.so libimgsensor.so

        # 2. Injeta em lote os drivers de aceleração gráfica da GPU PowerVR Rogue e Display
        touch libGLESv1_CM_pvr.so libGLESv2_pvr.so libglslcompiler.so libIMGegl.so \
              libpvrANDROID_WINDOW.so libpvrhwcomposer_drv.so libsrv_init.so libsrv_um.so \
              libusc.so libvulkan_pvr.so
              
        # 2.1 Injeta a identidade física de TODAS as outras lentes do Moto G22
        # Câmera Frontal (Selfie Samsung)
        touch libcamera_imgsensor_s5k4h7.so
        # Câmera Ultra-Wide (Ângulo Aberto OmniVision)
        touch libcamera_imgsensor_ov8856.so
        # Câmera Macro (OmniVision)
        touch libcamera_imgsensor_ov02b10.so
        # Câmera de Profundidade (Modo Retrato GalaxyCore)
        touch libcamera_imgsensor_gc02m1.so
        
        # 3. Organiza os arquivos de display nas subpastas corretas exigidas pelo Android 15
        touch hw/gralloc.mt6765.so hw/hwcomposer.mt6765.so hw/memtrack.mt6765.so
        touch egl/egl.cfg
        
        # 4. Força a biblioteca de customização a aceitar a identidade da lente Samsung do G22
        echo "s5kjn1_mipi_raw" >> libcameracustom.so
        
        echo "Estrutura híbrida e completa (Câmera + Gráficos GPU) montada com sucesso!"
